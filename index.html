<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#060a12" />
  <title>Chimera Front — Tactical Beast-Splicing Arena</title>
  <meta name="description" content="Splice animals and monsters into unique chimeras, deploy them across five lanes, and break the enemy nexus in a tactical auto-battler." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23070d15'/%3E%3Cpath d='M32 8 54 32 32 56 10 32Z' fill='none' stroke='%235fe3d1' stroke-width='3'/%3E%3Cpath d='M32 20 44 32 32 44 20 32Z' fill='%23f0c879'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app" id="app" aria-hidden="true">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M16 2 30 16 16 30 2 16Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M16 9 23 16 16 23 9 16Z" fill="currentColor" opacity=".7"/></svg>
        </span>
        <div class="brand-text">
          <h1>CHIMERA <em>FRONT</em></h1>
          <span>TACTICAL SPLICING ARENA</span>
        </div>
      </div>

      <div class="wave-progress" id="waveProgress"></div>

      <div class="top-resources">
        <div class="essence-pill" id="essencePill" title="Essence — spend it on beasts and splices">
          <span class="essence-gem" aria-hidden="true"></span>
          <span id="essenceVal">14</span>
          <small>ESSENCE</small>
        </div>
        <div class="nexus-pair" id="nexusPair">
          <div class="nexus-mini you">
            <span class="nm-label">YOU</span>
            <div class="nm-bar"><i id="nexusYouFill"></i></div>
            <span class="nm-val" id="nexusYouVal">120</span>
          </div>
          <div class="nexus-mini foe">
            <span class="nm-label">FOE</span>
            <div class="nm-bar"><i id="nexusFoeFill"></i></div>
            <span class="nm-val" id="nexusFoeVal">120</span>
          </div>
        </div>
        <button class="icon-btn" id="soundBtn" title="Toggle sound" aria-label="Toggle sound">
          <svg viewBox="0 0 24 24" class="ic-sound"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M16 8a6 6 0 0 1 0 8M18.5 5.5a9.5 9.5 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 24 24" class="ic-mute"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="m16 9 5 6m0-6-5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="helpBtn" title="How to play" aria-label="How to play">?</button>
      </div>
    </header>

    <main class="main">
      <section class="arena-column">
        <div class="arena-shell" id="arenaShell">
          <canvas id="arena" aria-label="Battle arena"></canvas>
          <div class="arena-grain" aria-hidden="true"></div>
          <div class="arena-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <div class="phase-banner" id="phaseBanner" aria-live="polite"></div>
          <div class="battle-timer" id="battleTimer" aria-hidden="true">
            <span class="bt-label">TIME</span>
            <span class="bt-value" id="battleTimerVal">1:00</span>
          </div>
          <div class="arena-hint" id="arenaHint"></div>
          <div class="speed-controls" id="speedControls" aria-hidden="true">
            <button class="speed-btn" data-speed="1" title="Normal speed">1×</button>
            <button class="speed-btn" data-speed="2" title="Double speed">2×</button>
            <button class="speed-btn" data-speed="3" title="Triple speed">3×</button>
          </div>
        </div>
      </section>

      <aside class="sidebar" id="sidebar" aria-live="polite"></aside>
    </main>

    <footer class="dock" id="dock">
      <div class="dock-head" id="dockHead"></div>
      <div class="dock-body" id="dockBody"></div>
    </footer>
  </div>

  <div class="title-screen" id="titleScreen">
    <canvas id="titleCanvas" aria-hidden="true"></canvas>
    <div class="title-vignette" aria-hidden="true"></div>
    <div class="title-ui">
      <div class="title-kicker"><span></span> A TACTICAL BEAST-SPLICING ARENA <span></span></div>
      <h1 class="game-logo">CHIMERA<span>FRONT</span></h1>
      <p class="title-tag">Splice the wild. Claim five lanes. Break their nexus.</p>
      <div class="title-cta">
        <button class="btn btn-primary btn-lg" id="startBtn">BEGIN THE RITE <span class="btn-arrow">›</span></button>
        <button class="btn btn-ghost" id="howBtn">HOW TO PLAY</button>
      </div>
      <div class="title-meta">
        <span>BEST WAVE <b id="bestWaveTitle">—</b></span>
        <i></i>
        <span>12 BEASTS</span>
        <i></i>
        <span>13 TRAITS</span>
        <i></i>
        <span>∞ SPLICES</span>
      </div>
    </div>
    <div class="title-version">RITE 01 · NO SAVE REQUIRED</div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <div class="modal-root" id="modalRoot"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
